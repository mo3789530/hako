name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hako
          POSTGRES_USER: hako
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hako -d hako"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: PostgreSQL integration tests and coverage
        env:
          HAKO_TEST_DATABASE_URL: postgres://hako:local-dev-only@127.0.0.1:5432/hako?sslmode=disable
        run: go test -tags=integration -coverpkg=./... -coverprofile=coverage.out ./... -count=1

  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.1
      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate dev roots
        shell: bash
        run: |
          set -euo pipefail
          for root in infra/terraform/environments/dev/control-plane infra/terraform/environments/dev/resource-plane; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
