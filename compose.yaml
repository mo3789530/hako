services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hako
      POSTGRES_USER: hako
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hako-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hako -d hako"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hako-postgres-data:
