[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hako-coding-agent"
version = "0.1.0"
requires-python = ">=3.14"
description = "Hako coding agent workflow for AgentCore Runtime"
dependencies = ["langgraph>=1.2.24,<1.3"]

[project.optional-dependencies]
agentcore = ["bedrock-agentcore>=1,<2"]
dev = [
    "bedrock-agentcore>=1,<2",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.coverage.report]
fail_under = 90

[tool.setuptools.packages.find]
where = ["src"]
